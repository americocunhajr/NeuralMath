name: Recompose Portuguese NeuralMath PDF
on:
  push:
    branches:
      - corrigir-pt-citacoes-pdf-unico-2026-11-13
    paths:
      - 'scripts/_compose_neuralmath_pt_pdf_once.py'
      - '.github/workflows/_compose_neuralmath_pt_pdf_once.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pypdf
        run: python -m pip install pypdf==5.9.0
      - name: Rebuild PDF with original NeuralMath cover
        run: python scripts/_compose_neuralmath_pt_pdf_once.py
      - name: Commit PDF on review branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/pdf/NeuralMath_PT.pdf
          git commit -m "docs(pt): recompose unico PDF com capa NeuralMath e manuscrito revisado"
          git push origin "HEAD:${GITHUB_REF_NAME}"
