name: SEO checks

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/check_seo.py'
      - '.github/workflows/seo-check.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/check_seo.py'
      - '.github/workflows/seo-check.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/check_seo.py
