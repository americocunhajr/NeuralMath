name: Apply technical SEO

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply configuration
        run: python scripts/apply_technical_seo.py
      - name: Validate technical SEO
        run: python scripts/check_seo.py
      - name: Commit configuration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs scripts/apply_technical_seo.py
          git diff --cached --quiet || git commit -m "Apply technical SEO metadata"
          git push origin main
