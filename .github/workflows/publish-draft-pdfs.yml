name: Publish draft PDFs locally

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-draft-pdfs.yml'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Noto fonts and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-noto-extra fonts-noto-cjk fontconfig qpdf poppler-utils

      - name: Reconstruct validated edition pipeline
        run: |
          cat .github/build/pdf-pipeline/chunk0 \
              .github/build/pdf-pipeline/chunk1 \
              .github/build/pdf-pipeline/chunk2 \
              .github/build/pdf-pipeline/chunk3a \
              .github/build/pdf-pipeline/chunk3b \
              .github/build/pdf-pipeline/chunk4a \
              .github/build/pdf-pipeline/chunk4b | base64 -d > /tmp/editions_pipeline.tar.gz
          echo "97fc2d859f552267fea5fe072763c5895169d4b6ad09755d51c4b11bba972ce5  /tmp/editions_pipeline.tar.gz" | sha256sum -c -
          tar -xzf /tmp/editions_pipeline.tar.gz

      - name: Restore untouched source article PDFs from repository history
        run: |
          git checkout 450da87c38bff7643c91c1912a8b6cbe26179849 -- docs/pdf
          test "$(find docs/pdf -type f -name 'Article_PMO2026_NN_*.pdf' | wc -l)" -eq 26

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r editions/requirements.txt
          pip uninstall -y segno || true
          python -m playwright install --with-deps chromium

      - name: Build the 26 draft editions
        run: |
          python editions/scripts/build_front.py
          python editions/scripts/assemble.py
          test "$(find editions/out -maxdepth 1 -type f -name 'NeuralMath_*.pdf' | wc -l)" -eq 26
          find editions/out -maxdepth 1 -type f -name 'NeuralMath_*.pdf' -size 0 -print -quit | grep -q . && exit 1 || true

      - name: Install PDFs under docs/pdf
        run: |
          rm -rf docs/pdf
          mkdir -p docs/pdf
          cp editions/out/NeuralMath_*.pdf docs/pdf/
          test "$(find docs/pdf -maxdepth 1 -type f -name 'NeuralMath_*.pdf' | wc -l)" -eq 26
          ls -lh docs/pdf

      - name: Point all web editions to locally hosted PDFs
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          langs = [
              ('en','docs/index.html'), ('pt','docs/pt/index.html'),
              ('es','docs/es/index.html'), ('fr','docs/fr/index.html'),
              ('it','docs/it/index.html'), ('de','docs/de/index.html'),
              ('ar','docs/ar/index.html'), ('bn','docs/bn/index.html'),
              ('cs','docs/cs/index.html'), ('el','docs/el/index.html'),
              ('fa','docs/fa/index.html'), ('hi','docs/hi/index.html'),
              ('hu','docs/hu/index.html'), ('id','docs/id/index.html'),
              ('ja','docs/ja/index.html'), ('ko','docs/ko/index.html'),
              ('nl','docs/nl/index.html'), ('pl','docs/pl/index.html'),
              ('ro','docs/ro/index.html'), ('ru','docs/ru/index.html'),
              ('sv','docs/sv/index.html'), ('tr','docs/tr/index.html'),
              ('uk','docs/uk/index.html'), ('ur','docs/ur/index.html'),
              ('vi','docs/vi/index.html'), ('zh','docs/zh/index.html'),
          ]

          for code, name in langs:
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              C = code.upper()
              zen = f'https://zenodo.org/records/23212380/files/NeuralMath_{C}.pdf?download=1'
              rel = f'pdf/NeuralMath_{C}.pdf' if code == 'en' else f'../pdf/NeuralMath_{C}.pdf'
              public = f'https://neuralmath.org/pdf/NeuralMath_{C}.pdf'
              s = s.replace(zen, rel)
              s = re.sub(
                  r'<meta name="citation_pdf_url" content="[^"]*"/>',
                  f'<meta name="citation_pdf_url" content="{public}"/>',
                  s
              )
              s = re.sub(r'<meta name="citation_doi" content="10\.5281/zenodo\.23212380"/>', '', s)
              s = re.sub(
                  r'<p class="small">NeuralMath · DOI:.*?10\.5281/zenodo\.23212380.*?</p>',
                  '',
                  s,
                  flags=re.S
              )
              if 'zenodo.org/records/23212380/files/' in s:
                  raise SystemExit(f'Zenodo PDF link remains in {name}')
              if rel not in s or public not in s:
                  raise SystemExit(f'Local PDF link missing in {name}')
              p.write_text(s, encoding='utf-8')

          readme = Path('README.md')
          s = readme.read_text(encoding='utf-8')
          s = re.sub(r'^\[!\[DOI\].*10\.5281/zenodo\.23212380.*\n', '', s, flags=re.M)
          s = re.sub(r'^\*\*Multilingual editions archive:\*\*.*\n', '', s, flags=re.M)
          s = s.replace(
              'The 26 archival PDF editions are stored on **Zenodo**, not duplicated in Git. Each language page links to its corresponding `NeuralMath_<CODE>.pdf` file under DOI **10.5281/zenodo.23212380**.',
              'The 26 draft PDF editions are stored in `docs/pdf/` and served directly from **https://neuralmath.org/pdf/**. Each language page links to its corresponding `NeuralMath_<CODE>.pdf` file.'
          )
          s = s.replace('Zenodo-archived PDF edition', 'locally hosted draft PDF edition')
          readme.write_text(s, encoding='utf-8')

          Path('CITATION.cff').write_text("""cff-version: 1.2.0
          message: "If you use NeuralMath, please cite the original pedagogical text in Portuguese."
          title: "NeuralMath"
          type: software
          version: "1.0"
          date-released: "2026-10-07"
          authors:
            - family-names: "Cunha Jr."
              given-names: "Americo"
              orcid: "https://orcid.org/0000-0002-8342-0363"
          repository-code: "https://github.com/americocunhajr/NeuralMath"
          url: "https://neuralmath.org"
          license: "CC-BY-4.0"
          preferred-citation:
            type: article
            title: "A anatomia matemática de uma rede neural"
            authors:
              - family-names: "Cunha Jr."
                given-names: "Americo"
                orcid: "https://orcid.org/0000-0002-8342-0363"
            journal: "Professor de Matemática Online (PMO)"
            year: 2026
            notes: "Manuscript submitted"
          """.replace('          ','').lstrip(), encoding='utf-8')
          PY

      - name: Validate website link policy and local PDFs
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          pages = [Path('docs/index.html')] + sorted(Path('docs').glob('??/index.html'))
          assert len(pages) == 26, len(pages)
          for p in pages:
              s = p.read_text(encoding='utf-8')
              anchors = re.findall(r'<a\b([^>]*)>', s)
              flags = [a for a in anchors if re.search(r'class="[^"]*\bflag\b', a)]
              nonflags = [a for a in anchors if a not in flags]
              assert len(flags) == 26, (p, len(flags))
              assert all('target="_blank"' not in a for a in flags), p
              assert all('target="_blank"' in a and 'rel="noopener noreferrer"' in a for a in nonflags), p
              assert 'zenodo.org/records/23212380/files/' not in s, p
          pdfs = sorted(Path('docs/pdf').glob('NeuralMath_*.pdf'))
          assert len(pdfs) == 26, len(pdfs)
          assert all(x.stat().st_size > 100000 for x in pdfs)
          print('Validated 26 pages and 26 local draft PDFs.')
          PY

      - name: Remove temporary build machinery
        run: |
          rm -rf editions
          rm -rf .github/build/pdf-pipeline
          rm -f .github/build/.upload_probe
          rm -f .github/workflows/publish-draft-pdfs.yml
          rmdir .github/build 2>/dev/null || true

      - name: Commit PDFs and website changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Host multilingual draft PDFs on NeuralMath.org"
          git push origin main
