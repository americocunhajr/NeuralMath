name: Notify IndexNow

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/submit_indexnow.py'
      - '.github/workflows/indexnow.yml'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/submit_indexnow.py
